[package]
name = "vs-scanners"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "net", "sync", "time", "io-util", "macros", "rt"] }
toml = "1.2.3"
vs-core = { version = "0.1.0", path = "../core" }
