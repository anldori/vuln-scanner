[package]
name = "vs-server"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
vs-core = { version = "0.1.0", path = "../core" }
vs-enrich = { version = "0.1.0", path = "../enrich" }
vs-report = { version = "0.1.0", path = "../report" }
vs-scanners = { version = "0.1.0", path = "../scanners" }
